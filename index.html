function dchart(a,b){const d0=Math.max(Math.min(a,b-7*864e5),b-62*864e5),days=[],m={};for(let t=d0;t<b;t+=864e5)days.push(day0(t));valid().filter(x=>x.ts>=d0&&x.ts<b).forEach(x=>{const k=day0(x.ts);m[k]=(m[k]||0)+x.total});const mx=Math.max(1,...days.map(t=>m[t]||0)),tl=t=>new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short'});return`<div class="card"><div class="k" id="bv">Ketuk batang untuk melihat tanggal dan omzet</div><div style="display:flex;align-items:flex-end;gap:4px;height:150px;overflow-x:auto;margin-top:8px">${days.map(t=>{const v=m[t]||0;return`<div onclick="$('#bv').textContent='${tl(t)}: ${rp(v)}'" style="flex:1;min-width:26px;max-width:56px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%"><div style="width:100%;height:${Math.max(3,Math.round(v/mx*110))}px;background:#166a40;border-radius:4px 4px 0 0"></div><span style="font-size:10px;margin-top:3px">${new Date(t).getDate()}</span></div>`}).join('')}</div></div>`}

function osum(g){const e=xin(ex(),S.rng).reduce((a,r)=>a+r.amount,0),gl=xin(sdm(),S.rng).reduce((a,r)=>a+r.qty,0);return`<h2>Ringkasan operasional</h2><div class="card"><div class="row"><span>Omzet penjualan</span><b>${rp(g.om)}</b></div><div class="row"><span>Pengeluaran operasional</span><b>${rp(e)}</b></div><div class="row"><span>Selisih omzet − pengeluaran</span><b>${rp(g.om-e)}</b></div><div class="row"><span>Minuman karyawan</span><b>${gl} gelas</b></div><p class="k">Selisih ini belum tentu laba bersih: belum memasukkan HPP, persediaan, utang, penyusutan, dan biaya lain. Estimasi biaya bahan minuman karyawan belum tersedia (belum ada data resep/HPP). Pembelian bahan (pengeluaran) dan bahan yang terpakai adalah dua hal berbeda.</p></div>`}

<div class="g2" style="margin-top:10px"><div class="card"><div class="k">Omzet</div><div class="v">${rp(g.om)}</div></div><div class="card"><div class="k">Diskon</div><div class="v">${rp(g.ds)}</div></div><div class="card"><div class="k">Transaksi</div><div class="v">${g.n}</div></div><div class="card"><div class="k">Produk terjual</div><div class="v">${g.qty}</div></div><div class="card"><div class="k">Dibatalkan</div><div class="v">${nv}</div></div></div>
