function prc(mid,parts,rows,miss){parts.forEach(p=>{const k=Math.max(p.lastIndexOf('='),p.lastIndexOf(':'));if(k<1)return;const n=p.slice(0,k).trim(),q=pn(p.slice(k+1)),g=ingN(n);if(!g){miss.push(n);return}if(q>0)rows.push({id:crypto.randomUUID(),menu_id:String(mid),ingredient_id:g.id,qty:q})})}

async function impS(k){const ls=$('#mt').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!ls.length)return toast('Isi datanya dulu');if(k==='b'){const rows=ls.map(l=>{const p=l.split('|').map(x=>x.trim());return{name:p[0],unit:['g','kg','ml','l','pcs'].includes((p[1]||'').toLowerCase())?p[1].toLowerCase():'g',min_stock:pn(p[2]||0),cost:pn(p[3]||0)}}).filter(r=>r.name);return WS(()=>rest('ingredients?on_conflict=tenant_id,name',{method:'POST',body:JSON.stringify(rows),headers:{Prefer:'resolution=merge-duplicates,return=minimal'}}))}const rows=[],miss=[],bad=[],ids=[];ls.forEach(l=>{const i=l.indexOf('|');if(i<1)return bad.push(l);const n=l.slice(0,i).trim().toLowerCase(),mn=S.menu.find(x=>x.name.toLowerCase()===n);if(!mn)return bad.push(l.slice(0,i).trim());ids.push(String(mn.id));prc(mn.id,l.slice(i+1).split(','),rows,miss)});if(bad.length||miss.length)return toast('Tidak ditemukan: '+[...new Set([...bad,...miss])].join(', '));await WS(async()=>{await rest('recipes?menu_id=in.('+ids.map(encodeURIComponent).join(',')+')',{method:'DELETE'});if(rows.length)await rest('recipes',{method:'POST',body:JSON.stringify(rows),headers:{Prefer:'return=minimal'}})})}
